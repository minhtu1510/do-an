      - ./labels:/app/labels
      - ./tmp:/app/tmp
    command: bash run_attacker.sh 3 ${TARGET:-192.168.1.10} ${SUBNET:-192.168.1.0/24}

  # ── Ngày 4 — Integrity Attacks ───────────────────────────────────
  attacker-day4:
