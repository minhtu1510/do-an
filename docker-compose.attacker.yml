    privileged: true
    environment:
      - TARGET=${TARGET:-192.168.1.10}
      - SUBNET=${SUBNET:-192.168.1.0/24}
      - IFACE=${IFACE:-eth0}
      - LOGGER_URL=${LOGGER_URL:-http://192.168.1.200:9000/label}
    volumes:
      - ./captures:/app/captures
